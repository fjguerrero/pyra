<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pyra</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="menubar">
        <span id="brand">Pyra</span>
        <div class="mbtn-wrap">
          <button type="button" id="menu-file-btn" class="mbtn" data-pop="export-menu" data-i18n="export_menu"></button>
          <div id="export-menu" class="pop" hidden>
            <button type="button" data-export data-i18n="export_fpng"></button>
            <button type="button" data-export-png data-i18n="export_png"></button>
            <button type="button" data-export-jpeg data-i18n="export_jpeg"></button>
            <button type="button" data-export-webp data-i18n="export_webp"></button>
            <button type="button" data-export-svg data-i18n="export_svg"></button>
            <button type="button" data-export-asset data-i18n="export_asset"></button>
            <label class="field" data-i18n="export_quality" for="export-quality"></label>
            <input type="number" id="export-quality" min="10" max="100" step="5" />
          </div>
        </div>
        <div class="mbtn-wrap">
          <button type="button" id="settings-btn" class="mbtn" data-pop="settings-menu" data-i18n="settings"></button>
          <div id="settings-menu" class="pop" hidden>
            <label data-i18n="language"></label>
            <select id="lang"></select>
            <label data-i18n="theme"></label>
            <div id="theme" class="themes">
              <button type="button" data-val="system"><i class="prev prev-system"></i><span data-i18n="theme_system"></span></button>
              <button type="button" data-val="light"><i class="prev prev-light"></i><span data-i18n="theme_light"></span></button>
              <button type="button" data-val="dark"><i class="prev prev-dark"></i><span data-i18n="theme_dark"></span></button>
              <button type="button" data-val="sepia"><i class="prev prev-sepia"></i><span data-i18n="theme_sepia"></span></button>
              <button type="button" data-val="midnight"><i class="prev prev-midnight"></i><span data-i18n="theme_midnight"></span></button>
              <button type="button" data-val="contrast"><i class="prev prev-contrast"></i><span data-i18n="theme_contrast"></span></button>
            </div>
            <label data-i18n="bg"></label>
            <div class="bg-row">
              <input type="color" id="bg-color" />
              <select id="bg-grid">
                <option value="0" data-i18n="bg_none"></option>
                <option value="10">10px</option>
                <option value="20">20px</option>
                <option value="50">50px</option>
                <option value="100">100px</option>
              </select>
            </div>
            <label data-i18n="node_color"></label>
            <div class="bg-row"><input type="color" id="node-color" /></div>
            <label data-i18n="frame_color"></label>
            <div class="bg-row"><input type="color" id="frame-color" /></div>
            <label data-i18n="units"></label>
            <div class="bg-row">
              <select id="unit">
                <option value="px">px</option>
                <option value="in">in</option>
                <option value="cm">cm</option>
                <option value="mm">mm</option>
              </select>
            </div>
            <label data-i18n="print_dpi"></label>
            <div class="bg-row"><input type="number" id="dpi" min="1" max="2400" step="1" /></div>
            <button type="button" id="help-btn" data-i18n="help"></button>
          </div>
        </div>
        <span id="status"><span id="status-text"></span></span>
        <div id="zoom-ctl">
          <button type="button" id="zoom-btn" data-icon="zoom" data-i18n-title="zoom"></button>
          <input type="number" id="zoom-num" min="5" max="1000" step="5" title="Zoom" />
          <div id="zoom-pop" hidden><input type="range" id="zoom-range" min="5" max="400" step="1" /></div>
        </div>
      </div>
      <div id="main">
        <div id="toolbar">
          <button type="button" class="tool active" data-tool="select" data-icon="cursor" aria-pressed="true" data-i18n-title="tool_select"></button>
          <button type="button" class="tool" data-tool="subselect" data-icon="subselect" aria-pressed="false" data-i18n-title="tool_subselect"></button>
          <button type="button" class="tool" data-tool="rect" data-icon="rect" aria-pressed="false" data-i18n-title="tool_rect"></button>
          <button type="button" class="tool" data-tool="ellipse" data-icon="ellipse" aria-pressed="false" data-i18n-title="tool_ellipse"></button>
          <button type="button" class="tool" data-tool="line" data-icon="line" aria-pressed="false" data-i18n-title="tool_line"></button>
          <button type="button" class="tool" data-tool="pen" data-icon="pen" aria-pressed="false" data-i18n-title="tool_pen"></button>
          <button type="button" class="tool" data-tool="pencil" data-icon="pencil" aria-pressed="false" data-i18n-title="tool_pencil"></button>
          <button type="button" class="tool" data-tool="polypen" data-icon="polypen" aria-pressed="false" data-i18n-title="pencil_polygon"></button>
          <button type="button" class="tool" data-tool="eraser" data-icon="eraser" aria-pressed="false" data-i18n-title="tool_eraser"></button>
          <button type="button" class="tool" data-tool="eyedropper" data-icon="eyedropper" aria-pressed="false" data-i18n-title="tool_eyedropper"></button>
          <button type="button" class="tool" data-tool="brush" data-icon="brush" aria-pressed="false" data-i18n-title="tool_brush"></button>
          <button type="button" class="tool" data-tool="text" data-icon="text" aria-pressed="false" data-i18n-title="tool_text"></button>
          <div class="tsep"></div>
          <button type="button" class="tool" data-import data-icon="import" data-i18n-title="import_image"></button>
          <button type="button" class="tool" data-fit data-icon="fit" data-i18n-title="fit_zoom"></button>
        </div>
        <div id="canvas-wrap"><canvas id="canvas"></canvas><div id="cursor-ring" hidden></div></div>
        <div id="side">
          <div class="panel" data-panel="align">
            <div class="panel-title" data-i18n="panel_align">Alinear</div>
            <div id="align-body"></div>
          </div>
          <div class="panel" data-panel="layers">
            <div class="panel-title" data-i18n="panel_layers">Capas</div>
            <div id="layers-body"></div>
          </div>
          <div class="panel" data-panel="pages">
            <div class="panel-title" data-i18n="panel_pages">Páginas</div>
            <div id="pages-body"></div>
          </div>
          <div class="panel" data-panel="inspector">
            <div class="panel-title" data-i18n="panel_inspector">Propiedades</div>
            <div id="inspector-body"></div>
          </div>
        </div>
      </div>
      <div id="help-modal" hidden></div>
    </div>
    <input type="file" id="import-file" accept="image/*" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
