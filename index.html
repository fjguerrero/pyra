<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pyra</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="inspector">
        <div id="inspector-body"></div>
      </div>
      <div id="main">
        <div id="toolbar">
          <button type="button" class="tool active" data-tool="select" aria-pressed="true" title="Selección (V)">V</button>
          <button type="button" class="tool" data-tool="rect" aria-pressed="false" title="Rectángulo (R)">▭</button>
          <button type="button" class="tool" data-tool="ellipse" aria-pressed="false" title="Elipse (E)">◯</button>
          <button type="button" class="tool" data-tool="line" aria-pressed="false" title="Línea (L)">╱</button>
          <button type="button" class="tool" data-tool="text" aria-pressed="false" title="Texto (T)">T</button>
          <button type="button" class="tool" data-import title="Importar imagen">🖼</button>
          <button type="button" class="tool" data-export title="Exportar .f.png">⬇</button>
          <button type="button" class="tool" data-fit title="Zoom ajustar (0)">⤢</button>
        </div>
        <div id="canvas-wrap"><canvas id="canvas"></canvas></div>
        <div id="side">
          <div class="panel">
            <div class="panel-title">Alinear</div>
            <div id="align-body"></div>
          </div>
          <div class="panel">
            <div class="panel-title">Capas</div>
            <div id="layers-body"></div>
          </div>
          <div class="panel">
            <div class="panel-title">Páginas</div>
            <div id="pages-body"></div>
          </div>
        </div>
      </div>
      <div id="status"></div>
    </div>
    <input type="file" id="import-file" accept="image/*" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
