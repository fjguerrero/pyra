<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pyra</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="inspector">
        <div id="inspector-body"></div>
      </div>
      <div id="main">
        <div id="toolbar">
          <div class="tool active" title="Selección (V)">V</div>
          <div class="tool" title="Rectángulo (Shift+arrastrar)">▭</div>
          <div class="tool" title="Zoom ajustar (0)">⤢</div>
        </div>
        <div id="canvas-wrap"><canvas id="canvas"></canvas></div>
        <div id="side">
          <div class="panel">
            <div class="panel-title">Capas</div>
            <div id="layers-body"></div>
          </div>
          <div class="panel">
            <div class="panel-title">Páginas</div>
            <div id="pages-body"></div>
          </div>
        </div>
      </div>
      <div id="status"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
