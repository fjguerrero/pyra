<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pyra</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="main">
        <div id="toolbar">
          <button type="button" class="tool active" data-tool="select" aria-pressed="true" data-i18n-title="tool_select">V</button>
          <button type="button" class="tool" data-tool="rect" aria-pressed="false" data-i18n-title="tool_rect">▭</button>
          <button type="button" class="tool" data-tool="ellipse" aria-pressed="false" data-i18n-title="tool_ellipse">◯</button>
          <button type="button" class="tool" data-tool="line" aria-pressed="false" data-i18n-title="tool_line">╱</button>
          <button type="button" class="tool" data-tool="text" aria-pressed="false" data-i18n-title="tool_text">T</button>
          <button type="button" class="tool" data-import data-i18n-title="import_image">🖼</button>
          <button type="button" class="tool" data-export data-i18n-title="export_fpng">⬇</button>
          <button type="button" class="tool" data-export-png data-i18n-title="export_png">🖼</button>
          <button type="button" class="tool" data-fit data-i18n-title="fit_zoom">⤢</button>
          <select id="lang" title="Idioma"></select>
        </div>
        <div id="canvas-wrap"><canvas id="canvas"></canvas></div>
        <div id="side">
          <div class="panel" data-panel="layers">
            <div class="panel-title" data-i18n="panel_layers">Capas</div>
            <div id="layers-body"></div>
          </div>
          <div class="panel" data-panel="pages">
            <div class="panel-title" data-i18n="panel_pages">Páginas</div>
            <div id="pages-body"></div>
          </div>
          <div class="panel" data-panel="inspector">
            <div class="panel-title" data-i18n="panel_inspector">Propiedades</div>
            <div id="inspector-body"></div>
          </div>
          <div class="panel" data-panel="align">
            <div class="panel-title" data-i18n="panel_align">Alinear</div>
            <div id="align-body"></div>
          </div>
        </div>
      </div>
      <div id="status"></div>
    </div>
    <input type="file" id="import-file" accept="image/*" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
